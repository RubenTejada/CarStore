name: Dealer demo

# Crea o actualiza el dealer de demostración del módulo de redes sociales (scripts/create-demo-dealer.ts,
# docs/demo-redes-sociales.md). Sin «aplicar» solo muestra lo que haría.
#
# Secretos del repositorio (Settings → Secrets and variables → Actions):
#   DATABASE_URL       base de datos de producción
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID   para abrir el firewall de la base (ver deploy.yml)
#   DEMO_DEALER_PASSWORD   contraseña de demo@tucarroonline.com (obligatoria: el registro de Actions es visible)
#   DEMO_DEALER_PHONE      opcional: WhatsApp que muestran los anuncios del dealer demo

on:
  workflow_dispatch:
    inputs:
      aplicar:
        description: "Escribir en la base (si no, solo simula)"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: demo-dealer
  cancel-in-progress: false

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # El firewall de la base solo admite servicios de Azure: se abre a la IP de este runner.
      - name: Abrir firewall de la base
        run: |
          IP=$(curl -fsS https://api.ipify.org)
          az postgres flexible-server firewall-rule create -g nexconta --server-name nexconta-db-b \
            -n gh-demo-${{ github.run_id }} --start-ip-address $IP --end-ip-address $IP -o none
      - name: Crear dealer demo
        run: |
          test -n "$DEMO_DEALER_PASSWORD" || { echo "Falta el secreto DEMO_DEALER_PASSWORD"; exit 1; }
          npm run demo:dealer -- ${{ inputs.aplicar && '--yes' || '' }}
        env:
          NODE_ENV: production
          SITE_URL: ${{ vars.SITE_URL || 'https://tucarroonline.com' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEMO_DEALER_PASSWORD: ${{ secrets.DEMO_DEALER_PASSWORD }}
          DEMO_DEALER_PHONE: ${{ secrets.DEMO_DEALER_PHONE }}
      - name: Cerrar firewall de la base
        if: always()
        run: |
          az postgres flexible-server firewall-rule delete -g nexconta --server-name nexconta-db-b \
            -n gh-demo-${{ github.run_id }} --yes -o none || true
